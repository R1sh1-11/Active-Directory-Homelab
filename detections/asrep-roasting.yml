title: AS-REP Roasting
status: experimental
description: Detects AS-REP roasting attempts against accounts with pre-auth disabled
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4768
        PreAuthType: '0'
    condition: selection
falsepositives:
    - Accounts intentionally configured without pre-authentication
level: high
tags:
    - attack.credential_access
    - attack.t1558.004
