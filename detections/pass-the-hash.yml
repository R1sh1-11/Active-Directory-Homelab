title: Pass-the-Hash Attack
status: experimental
description: Detects potential Pass-the-Hash activity via NTLM network logons
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
    filter:
        AccountName: 'ANONYMOUS LOGON'
    condition: selection and not filter
falsepositives:
    - Legitimate NTLM network authentication
level: medium
tags:
    - attack.lateral_movement
    - attack.t1550.002
