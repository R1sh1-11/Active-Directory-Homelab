title: Password Spray Attack
status: experimental
description: Detects password spraying by looking for multiple failed logins from one source across different accounts
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    timeframe: 5m
    condition: selection | count(TargetUserName) by IpAddress > 5
falsepositives:
    - Misconfigured service accounts
    - Users forgetting passwords
level: medium
tags:
    - attack.credential_access
    - attack.t1110.003
