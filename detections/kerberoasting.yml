title: Kerberoasting Activity
status: experimental
description: Detects Kerberos service ticket requests using RC4 encryption, indicative of Kerberoasting
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4769
        TicketEncryptionType: '0x17'
    filter:
        ServiceName|endswith: '$'
    filter_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not filter and not filter_krbtgt
falsepositives:
    - Legacy systems that only support RC4
level: high
tags:
    - attack.credential_access
    - attack.t1558.003
